<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistema de gestión de pedidos para La Bomba">

  <!-- PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Bomba">
  <meta name="theme-color" content="#FF6B35">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>La Bomba - Sistema de Pedidos</title>
  <link rel="manifest" href="manifest.json">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body, html { margin: 0; padding: 0; background: #1a1a2e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #boot-status {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; flex-direction: column; gap: 16px;
      padding: 20px; text-align: center; z-index: 1;
    }
    #boot-spinner {
      width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #ff6b35; border-radius: 50%;
      animation: bs 0.8s linear infinite;
    }
    @keyframes bs { to { transform: rotate(360deg); } }
    #boot-msg { font-size: 14px; color: rgba(255,255,255,0.7); }
    #boot-error {
      display: none; max-width: 500px; padding: 16px;
      background: rgba(255,80,80,0.15); border: 1px solid rgba(255,80,80,0.4);
      border-radius: 8px; font-size: 13px; line-height: 1.5;
    }
    #boot-error a { color: #ffa07a; }
  </style>
</head>
<body>
  <div id="boot-status">
    <div id="boot-spinner"></div>
    <div id="boot-msg">Cargando La Bomba...</div>
    <div id="boot-error"></div>
  </div>

  <script>
    // Loader visible mientras Flutter inicializa.
    // Se ESCONDE automáticamente cuando Flutter renderiza su primer frame
    // (evento 'flutter-first-frame'). Si después de 15s no terminó,
    // muestra instrucciones de troubleshooting.
    (function () {
      var status = document.getElementById('boot-status');
      var msg = document.getElementById('boot-msg');
      var err = document.getElementById('boot-error');
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        if (status) status.style.display = 'none';
      }

      // Flutter Web dispara este evento al renderizar el primer frame.
      window.addEventListener('flutter-first-frame', hideLoader);

      // Fallback: cuando Flutter inserta su canvas en el DOM
      // (algunas versiones no disparan flutter-first-frame en web).
      var observer = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane, flt-scene-host')) {
          hideLoader();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Mensaje de error si el bootstrap se cuelga
      setTimeout(function () {
        if (done) return;
        msg.textContent = 'La carga está demorando más de lo esperado.';
        err.style.display = 'block';
        err.innerHTML =
          'Si seguís viendo esta pantalla, hay datos antiguos en tu navegador. ' +
          'Probá: Hard refresh (Cmd+Shift+R / Ctrl+Shift+R) o ' +
          '<a href="/reset.html">abrir limpieza</a>.';
      }, 15000);
    })();
  </script>
  <script>
    // Lee un código de barras desde una imagen (foto de galería o archivo).
    // La usa el escáner de la app en web; devuelve el código o null.
    window.laBombaDecodeBarcode = async function (url) {
      var img = new Image();
      img.src = url;
      await img.decode();

      // 1. Detector nativo del navegador (Chrome/Android): el más preciso con fotos.
      if ('BarcodeDetector' in window) {
        try {
          var found = await new BarcodeDetector().detect(img);
          for (var i = 0; i < found.length; i++) {
            if (found[i].rawValue) return found[i].rawValue;
          }
        } catch (e) {}
      }

      // 2. ZXing (iPhone/Safari y demás). Es la misma librería que usa la cámara.
      if (!window.ZXing) {
        await new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      var hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      var reader = new ZXing.BrowserMultiFormatReader(hints);

      // Las fotos grandes se leen mal: se prueba en varios tamaños y girada.
      var sizes = [1600, 1000, 600, 2400];
      var angles = [0, 90];
      for (var a = 0; a < angles.length; a++) {
        for (var k = 0; k < sizes.length; k++) {
          var scale = Math.min(1, sizes[k] / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * scale));
          var h = Math.max(1, Math.round(img.naturalHeight * scale));
          var canvas = document.createElement('canvas');
          var rotated = angles[a] === 90;
          canvas.width = rotated ? h : w;
          canvas.height = rotated ? w : h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          if (rotated) {
            ctx.translate(h, 0);
            ctx.rotate(Math.PI / 2);
          }
          ctx.drawImage(img, 0, 0, w, h);
          try {
            var result = await reader.decodeFromImageUrl(canvas.toDataURL('image/png'));
            if (result && result.getText()) return result.getText();
          } catch (e) {}
        }
      }
      return null;
    };
  </script>
  <script>
    // Voz de la app en la web (pagos Bre-B, avisos). UNA sola función para
    // todo: la llama la app (TextToSpeechService → labombaSpeak) con la
    // pestaña al frente, y el service worker de notificaciones
    // (firebase-messaging-sw.js) con la pestaña en segundo plano — el
    // service worker no puede hablar, así que le pasa la frase a la página.
    (function () {
      if (!('speechSynthesis' in window)) return;
      var synth = window.speechSynthesis;
      var PREF = ['es-co', 'es-419', 'es-us', 'es-mx', 'es-es'];
      var voice = null;
      var spoken = {}; // clave (id del cobro) -> cuándo se dijo

      function norm(lang) { return String(lang || '').toLowerCase().replace('_', '-'); }
      function rank(v) { var i = PREF.indexOf(norm(v.lang)); return i < 0 ? PREF.length : i; }
      function pickVoice() {
        var es = (synth.getVoices() || []).filter(function (v) { return norm(v.lang).indexOf('es') === 0; });
        es.sort(function (a, b) { return rank(a) - rank(b) || (b.localService ? 1 : 0) - (a.localService ? 1 : 0); });
        voice = es[0] || null;
      }
      pickVoice();
      if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);

      window.labombaSpeak = function (text, key) {
        text = String(text || '').trim();
        if (!text) return false;
        var now = Date.now();
        for (var k in spoken) if (now - spoken[k] > 120000) delete spoken[k];
        if (key) {
          if (spoken[key]) return true; // ya se anunció este pago
          spoken[key] = now;
        }
        try {
          if (!voice) pickVoice();
          var u = new SpeechSynthesisUtterance(text);
          if (voice) { u.voice = voice; u.lang = voice.lang; } else { u.lang = 'es-CO'; }
          u.rate = 1.0;
          u.volume = 1.0;
          // Chrome a veces deja la voz "en pausa" para siempre: cancelar y
          // reanudar antes de hablar la destraba.
          synth.cancel();
          synth.resume();
          synth.speak(u);
        } catch (e) {}
        return true;
      };

      // Chrome solo deja hablar a una página con la que el usuario ya
      // interactuó: al primer clic/tecla se "desbloquea" la voz con una
      // frase muda, para que los avisos que lleguen después sí suenen.
      function unlock() {
        window.removeEventListener('pointerdown', unlock, true);
        window.removeEventListener('keydown', unlock, true);
        try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch (e) {}
      }
      window.addEventListener('pointerdown', unlock, true);
      window.addEventListener('keydown', unlock, true);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function (event) {
          var msg = event.data || {};
          if (msg.type === 'labomba_voice' && msg.text) window.labombaSpeak(msg.text, msg.key);
        });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
